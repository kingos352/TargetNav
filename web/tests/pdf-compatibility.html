<!doctype html><meta charset="utf-8"><title>Android PDF compatibility test</title><button id="run">Android PDF testini çalıştır</button><pre id="result">Hazır</pre><script type="module">
import {extractPDFText,documentKind} from './pdf-reader.mjs';import {extractTDS} from './core.mjs';
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#result');try{Promise.withResolvers=undefined;const bytes=await fetch('./pdf-qa-sample.pdf').then(r=>r.arrayBuffer());if(documentKind({name:'document:123',type:''},bytes)!=='pdf')throw Error('Signature detection failed');const text=await extractPDFText(bytes,{webview:location.search!=='?browser',onProgress:m=>out.textContent=m});const tasks=extractTDS(text),goals=tasks.flatMap(t=>t.goals);if(tasks.length!==4||goals.length!==6)throw Error('Task/goal mismatch');out.textContent='PASS: Extensionless PDF detected. Legacy PDF engine restored Promise.withResolvers. Android in-process worker parsed '+tasks.length+' tasks and '+goals.length+' four-digit goals.\n'+goals.map(g=>g.coord).join('\n');}catch(e){out.textContent='FAIL: '+e.stack;}};
</script>
