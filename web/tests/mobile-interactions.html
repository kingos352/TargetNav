<!doctype html><meta charset="utf-8"><title>Mobil boyut testi</title><style>body{margin:0;background:#dce1e5;font:14px sans-serif}a{display:inline-block;padding:10px}iframe{display:block;border:1px solid #87909a;background:white}</style><a href="?w=390&h=844">Telefon 390×844</a><a href="?w=360&h=640">Telefon 360×640</a><a href="?w=768&h=1024">Tablet 768×1024</a><a href="?w=1024&h=768">Tablet yatay 1024×768</a><button id="run">Hareket ve kayıt testini çalıştır</button><pre id="results"></pre><iframe title="PUSULA test"></iframe><script>const p=new URLSearchParams(location.search),f=document.querySelector('iframe');f.width=p.get('w')||390;f.height=p.get('h')||844;f.src='./';</script>
<script>
const pause=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#results'),w=f.contentWindow,d=w.document,results=[];const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);out.textContent=results.join('\n');};try{d.querySelector('#coordinateButton').click();d.querySelector('#quickCoord').value='38.645, 34.83';d.querySelector('#quickForm').requestSubmit();await pause(300);let el=d.querySelector('[data-point-id]:last-child'),id=el.dataset.pointId;const saved=()=>JSON.parse(w.localStorage.getItem('aerostat.plan.v1')).points.find(p=>p.id===id);const before=saved();const rect=el.getBoundingClientRect(),x=rect.x+20,y=rect.y+20;const fire=(target,type,px=x,py=y)=>target.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:1,pointerType:'touch',isPrimary:true,button:0,clientX:px,clientY:py}));fire(el,'pointerdown');await pause(150);fire(w,'pointermove',x+35,y+20);fire(w,'pointerup',x+35,y+20);await pause(250);check('Kısa sürükleme hedefi taşımaz',saved().lat===before.lat&&saved().lng===before.lng);fire(el,'pointerdown');await pause(560);check('Uzun basma düzenlemeyi açar',!d.querySelector('#selectionEdit').hidden);fire(w,'pointermove',x+40,y+30);fire(w,'pointerup',x+40,y+30);await pause(300);const moved=saved();check('Uzun basıp sürükleme konumu kaydeder',moved.lat!==before.lat&&moved.lng!==before.lng);el=d.querySelector('[data-point-id="'+id+'"]');fire(el,'pointerdown');await pause(560);fire(w,'pointermove',x+60,y+60);fire(w,'pointercancel',x+60,y+60);await pause(300);check('İptal edilen taşıma eski konumu korur',saved().lat===moved.lat&&saved().lng===moved.lng);const nav=d.querySelector('nav'),buttons=[...nav.querySelectorAll('button')];check('Sekmeler tek satır ve yatay kaydırılabilir',buttons.every(b=>b.offsetTop===buttons[0].offsetTop)&&w.getComputedStyle(nav).overflowX==='auto');check('Sayfa yatay taşmaz',d.documentElement.scrollWidth===w.innerWidth);f.contentWindow.location.reload();for(let i=0;i<50&&!f.contentDocument.querySelector('[data-point-id="'+id+'"]');i++)await pause(100);check('Yeniden açılışta hedef korunur',!!f.contentDocument.querySelector('[data-point-id="'+id+'"]'));}catch(e){out.textContent+='\nFAIL '+e.message;}};
</script>
